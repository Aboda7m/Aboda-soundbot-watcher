<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Recordings</title>
  <link rel="stylesheet" href="/recordings.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="top">
    <div class="top-row">
      <h1>Recordings</h1>
      <a class="back" href="/">Back to soundboard</a>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <p id="banner" class="banner" role="alert" hidden></p>

    <!-- ============ LIST VIEW ============ -->
    <section id="list-view" aria-label="All recordings">
      <form id="filters" class="filters" role="search" autocomplete="off">
        <label class="field grow">
          <span>Search</span>
          <input id="q" type="search" placeholder="Server, channel, person, user ID, server ID, date…" spellcheck="false">
        </label>
        <label class="field">
          <span>Server</span>
          <select id="f-server"><option value="">All servers</option></select>
        </label>
        <label class="field">
          <span>Person</span>
          <select id="f-person"><option value="">Everyone</option></select>
        </label>
        <label class="field">
          <span>From</span>
          <input id="f-from" type="date">
        </label>
        <label class="field">
          <span>To</span>
          <input id="f-to" type="date">
        </label>
        <label class="field">
          <span>Sort</span>
          <select id="f-sort">
            <option value="new">Newest first</option>
            <option value="old">Oldest first</option>
            <option value="long">Longest first</option>
            <option value="big">Largest first</option>
          </select>
        </label>
        <div class="filter-actions">
          <label class="check"><input type="checkbox" id="f-empty"> Show empty</label>
          <button id="clear" class="btn small" type="button">Clear filters</button>
        </div>
      </form>

      <p id="summary" class="summary" role="status"></p>

      <div id="results" class="results"></div>
      <div id="more-bar" class="more-bar" hidden>
        <button id="more" class="btn" type="button">Show more</button>
      </div>
      <p id="empty" class="empty" hidden></p>
    </section>

    <!-- ============ DETAIL VIEW ============ -->
    <section id="detail-view" aria-label="Recording" hidden>
      <p class="crumbs"><a id="to-list" class="back" href="#/">&larr; All recordings</a></p>

      <header class="d-head">
        <h2 id="d-title"></h2>
        <p id="d-sub" class="d-sub"></p>
        <p id="d-meta" class="d-meta"></p>
      </header>

      <div class="d-tools">
        <fieldset class="speakers" id="d-speakers">
          <legend>Speakers <span class="hint">(click to show or hide)</span></legend>
        </fieldset>
        <label class="field zoom">
          <span>Timeline zoom</span>
          <input id="zoom" type="range" min="0" max="100" value="0" aria-label="Timeline zoom">
        </label>
      </div>

      <div id="timeline" class="timeline" role="group" aria-label="Timeline of who spoke when. Each block is one stretch of speech; activate it to play."></div>
      <p id="d-note" class="hint note" hidden></p>

      <div class="seg-wrap">
        <table class="seg-table">
          <caption class="visually-hidden">Segments of this recording in time order</caption>
          <thead>
            <tr><th>#</th><th>Speaker</th><th>Starts at</th><th>Clock time</th><th>Length</th><th>Size</th><th><span class="visually-hidden">Actions</span></th></tr>
          </thead>
          <tbody id="seg-body"></tbody>
        </table>
        <p id="seg-empty" class="empty" hidden>No speech was captured in this recording.</p>
      </div>
    </section>
  </main>

  <!-- ============ PLAYER ============ -->
  <footer id="player" class="player" hidden aria-label="Player">
    <div class="p-row">
      <div class="p-now">
        <p id="p-title" class="p-title">Nothing playing</p>
        <p id="p-sub" class="p-sub"></p>
      </div>
      <div class="p-ctl">
        <button id="p-prev" class="btn small" type="button" aria-label="Previous segment"><span aria-hidden="true">&laquo;</span><span class="lbl"> Prev</span></button>
        <button id="p-next" class="btn small" type="button" aria-label="Next segment"><span class="lbl">Next </span><span aria-hidden="true">&raquo;</span></button>
        <label class="check"><input type="checkbox" id="p-auto" checked> Play through</label>
        <label class="field inline">
          <span class="visually-hidden">Speed</span>
          <select id="p-speed" aria-label="Playback speed">
            <option value="0.75">0.75×</option><option value="1" selected>1×</option>
            <option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option>
          </select>
        </label>
        <a id="p-dl" class="btn small" href="#" download hidden>Download</a>
      </div>
    </div>
    <audio id="audio" controls preload="none"></audio>
  </footer>

  <script src="/recordings.js" defer></script>
</body>
</html>
